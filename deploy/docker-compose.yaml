services:
  graphlab:
    build:
      context: ..
      dockerfile: app/backend/docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: graphlab-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017/graphlab}
    env_file:
      - path: .env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - graphlab-internal

  mongo-init:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.mongo-init
    container_name: graphlab-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo
      DB_NAME: graphlab
      GRAPHS_JSON: /data/graphs.json
      FORCE_INIT: ${FORCE_INIT:-0}
      BACKUP_REMOTE_HOST: ${BACKUP_REMOTE_HOST:-}
      BACKUP_REMOTE_USER: ${BACKUP_REMOTE_USER:-}
      BACKUP_REMOTE_PATH: ${BACKUP_REMOTE_PATH:-}
      BACKUP_SSH_STRICT: ${BACKUP_SSH_STRICT:-accept-new}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./graphs.json:/data/graphs.json:ro
    networks:
      - graphlab-internal

  mongo:
    image: mongo:7
    container_name: graphlab-db
    restart: unless-stopped
    volumes:
      - graphlab-db:/data/db
    environment:
      MONGO_INITDB_DATABASE: graphlab
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - graphlab-internal

networks:
  graphlab-internal:
    driver: bridge

volumes:
  graphlab-db:
