services:
  graphlab:
    build:
      context: ..
      dockerfile: app/backend/docker/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graphlab.tls=true"
      - "traefik.http.routers.graphlab.service=graphlab-service"
      - "traefik.http.routers.graphlab.entrypoints=web,websecure"
      - "traefik.http.routers.graphlab.middlewares=graphlab-stripprefix"
      - "traefik.http.routers.graphlab.rule=Host(`portail.terra-numerica.org`) && PathPrefix(`/graphlab`)"
      - "traefik.http.services.graphlab-service.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.graphlab-stripprefix.stripprefix.prefixes=/graphlab"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
    networks:
      - traefik
  mongo:
    image: mongo:7
    container_name: graphlab-db
    restart: unless-stopped
    volumes:
      - graphlab-db:/data/db
    environment:
      MONGO_INITDB_DATABASE: graphlab
    ports:
      - "27017:27017" # optionnel, utile pour debug avec MongoDB Compass

networks:
  traefik:
    external: true

volumes:
  graphlab-db: