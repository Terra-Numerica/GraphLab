# Stack par défaut (production). Usage : docker compose up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: app/backend/docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ${APP_ID:-graphlab}-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017/${APP_ID:-graphlab}}
    env_file:
      - path: .env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_ID:-graphlab}.tls=true"
      - "traefik.http.routers.${APP_ID:-graphlab}.service=${APP_ID:-graphlab}-service"
      - "traefik.http.routers.${APP_ID:-graphlab}.entrypoints=web,websecure"
      - "traefik.http.routers.${APP_ID:-graphlab}.middlewares=${APP_ID:-graphlab}-stripprefix"
      - "traefik.http.routers.${APP_ID:-graphlab}.rule=Host(`portail.terra-numerica.org`) && PathPrefix(`/${APP_ID:-graphlab}`)"
      - "traefik.http.services.${APP_ID:-graphlab}-service.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.${APP_ID:-graphlab}-stripprefix.stripprefix.prefixes=/${APP_ID:-graphlab}"
    networks:
      - internal
      - traefik

  mongo-init:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.mongo-init
    container_name: ${APP_ID:-graphlab}-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo
      DB_NAME: ${DB_NAME:-${APP_ID:-graphlab}}
      GRAPHS_JSON: /data/graphs.json
      FORCE_INIT: ${FORCE_INIT:-0}
      BACKUP_REMOTE_HOST: ${BACKUP_REMOTE_HOST:-}
      BACKUP_REMOTE_USER: ${BACKUP_REMOTE_USER:-}
      BACKUP_REMOTE_PATH: ${BACKUP_REMOTE_PATH:-}
      BACKUP_SSH_STRICT: ${BACKUP_SSH_STRICT:-accept-new}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./graphs.json:/data/graphs.json:ro
      - ${BACKUP_SSH_KEY_PATH:-/dev/null}:/run/secrets/backup_ssh_key:ro
    networks:
      - internal

  mongo:
    image: mongo:7
    container_name: ${APP_ID:-graphlab}-db
    restart: unless-stopped
    volumes:
      - db-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-${APP_ID:-graphlab}}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    driver: bridge
  traefik:
    external: true

volumes:
  db-data:
